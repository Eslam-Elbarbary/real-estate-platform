services:
  postgres:
    image: postgres:16-alpine
    container_name: aqarmap-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aqarmap
    volumes:
      - aqarmap_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d aqarmap']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aqarmap_pg_data:
